name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runway:
    name: runway (lint, types, unit tests, drills)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: scripts/annotate_on_failure.sh "ruff" sh -c "ruff check . && ruff format --check ."
      - run: scripts/annotate_on_failure.sh "mypy" mypy
      - run: scripts/annotate_on_failure.sh "pytest" pytest -q
      - name: Cutover drill
        run: |
          scripts/annotate_on_failure.sh "cutover drill" runway drill --out reports/drill.json > /dev/null
          python3 -c "import json;print('::notice title=cutover drill::'+json.load(open('reports/drill.json'))['headline'])"

  vsphere:
    name: inventory against vcsim (VMware vCenter simulator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Start vcsim
        run: |
          docker run -d --name vcsim -p 8989:8989 vmware/vcsim:v0.46.3 -l 0.0.0.0:8989
          for i in $(seq 1 30); do curl -sk https://127.0.0.1:8989/about >/dev/null && break; sleep 1; done
      - run: scripts/annotate_on_failure.sh "vcsim tests" pytest -q -m vcsim
        env:
          RUNWAY_VCENTER_URL: https://127.0.0.1:8989/sdk
      - name: Inventory, assess and plan from the simulator
        run: |
          RUNWAY_VCENTER_PASSWORD=pass runway inventory --vcenter https://127.0.0.1:8989/sdk --user user --insecure --out inventory.json
          runway assess inventory.json | head -20

  generated-terraform:
    name: generated Terraform validates against the bpg/proxmox provider
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: pip install -e .
      - run: runway generate sim --start 2026-11-16 --out generated
      - name: terraform validate every wave
        env:
          TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for d in generated/terraform/wave-*; do
            (cd "$d" && ../../../scripts/annotate_on_failure.sh "terraform validate $d" sh -c "terraform init -backend=false -input=false -no-color >/dev/null && terraform validate -no-color") || exit 1
          done
          echo "::notice title=generated Terraform::$(ls -d generated/terraform/wave-* | wc -l) wave roots, $(grep -o '\"vm_id\"' -r generated/terraform | wc -l) VMs, all valid against bpg/proxmox"

  ansible:
    name: ansible (lint, Molecule on Rocky 9 and Debian 12)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ansible-core==2.18.1" "ansible-lint==24.12.2" "molecule==24.12.0" "molecule-plugins[docker]==23.6.0" "docker==7.1.0"
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ../../scripts/annotate_on_failure.sh "ansible-lint" ansible-lint
      - run: ../../scripts/annotate_on_failure.sh "molecule" molecule test

  terraform:
    name: terraform (fmt, validate, plan tests with mocked AWS and Proxmox)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: ../../scripts/annotate_on_failure.sh "terraform fmt" terraform fmt -check -recursive -diff
      - run: ../../scripts/annotate_on_failure.sh "terraform init" terraform init -backend=false -input=false -no-color
      - run: ../../scripts/annotate_on_failure.sh "terraform validate" terraform validate -no-color
      - run: ../../scripts/annotate_on_failure.sh "terraform test" terraform test -no-color

  bicep:
    name: bicep (build and lint the Azure hub)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/bicep
    steps:
      - uses: actions/checkout@v5
      - run: az bicep install
      - run: ../../scripts/annotate_on_failure.sh "bicep build" az bicep build --file main.bicep --stdout > /dev/null
      - run: ../../scripts/annotate_on_failure.sh "bicep lint" az bicep lint --file main.bicep
      - run: ../../scripts/annotate_on_failure.sh "bicep params" az bicep build-params --file main.bicepparam --stdout > /dev/null

  gitops:
    name: gitops on kind (Argo CD sync, launch freeze blocks a sync, OpenShift manifests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Committed AppProject enforces every current freeze
        run: scripts/annotate_on_failure.sh "freeze drift" runway freeze argocd --check platform/gitops/projects/platform.yaml
      - name: OpenShift and kind overlays are valid (kubeconform, OpenShift CRD schemas)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for o in platform/gitops/apps/*/overlays/*; do
            kubectl kustomize "$o" | ./kubeconform -strict -summary -kubernetes-version 1.30.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              || { echo "::error title=kubeconform::$o"; exit 1; }
          done
          ./kubeconform -strict -summary -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            platform/gitops/projects platform/gitops/applicationsets platform/gitops/bootstrap
      - name: Build the runway image
        run: docker build -f deploy/runway.Dockerfile -t runway:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: runway
      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.14.0/manifests/install.yaml
          kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-applicationset-controller --timeout=300s
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s
          kind load docker-image runway:ci --name runway
      - name: Argo CD syncs runway from this commit
        run: |
          runway freeze argocd > /tmp/project.yaml
          kubectl apply -f /tmp/project.yaml
          cat <<YAML | kubectl apply -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata: {name: runway, namespace: argocd}
          spec:
            project: platform
            source: {repoURL: "https://github.com/${{ github.repository }}", targetRevision: "${{ github.sha }}", path: platform/gitops/apps/runway/overlays/kind}
            destination: {server: "https://kubernetes.default.svc", namespace: runway}
            syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
          YAML
          for i in $(seq 1 60); do
            h=$(kubectl -n argocd get application runway -o jsonpath='{.status.health.status}/{.status.sync.status}' 2>/dev/null || true)
            [ "$h" = "Healthy/Synced" ] && break; sleep 5
          done
          kubectl -n argocd get application runway -o jsonpath='{.status.health.status}/{.status.sync.status}{"\n"}'
          [ "$h" = "Healthy/Synced" ] || { kubectl -n argocd get application runway -o yaml | tail -40 | scripts/annotate_on_failure.sh "argo cd sync" sh -c 'cat; exit 1'; }
          kubectl -n runway port-forward svc/runway 8070:8070 >/dev/null 2>&1 &
          sleep 3
          curl -sf localhost:8070/api/summary | python3 -c "import json,sys;d=json.load(sys.stdin);print('::notice title=runway on kind::'+str(d['estate']['vms'])+' VMs, '+str(d['plan']['waves'])+' waves')"
      - name: A launch freeze blocks the next sync
        run: |
          mkdir -p /tmp/frozen && ci/kind/freeze-config.sh /tmp/frozen
          RUNWAY_CONFIG=/tmp/frozen runway freeze argocd > /tmp/frozen-project.yaml
          kubectl apply -f /tmp/frozen-project.yaml
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/download/v2.14.0/argocd-linux-amd64 && chmod +x argocd
          kubectl config set-context --current --namespace=argocd
          set +e
          out=$(./argocd app sync runway --core 2>&1); code=$?
          set -e
          echo "$out"
          if [ $code -eq 0 ] || ! echo "$out" | grep -qi "sync window"; then
            echo "::error title=launch freeze::Argo CD synced during a launch freeze"; exit 1
          fi
          echo "::notice title=launch freeze::Argo CD refused to sync during the ci-flight freeze: $(echo "$out" | grep -i 'sync window' | head -1)"
