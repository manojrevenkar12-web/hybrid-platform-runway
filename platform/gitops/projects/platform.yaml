apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform services. Sync windows are generated by `runway freeze argocd`
    from config/launch-calendar.yaml.
  sourceRepos:
  - '*'
  destinations:
  - server: '*'
    namespace: '*'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  syncWindows:
  - kind: deny
    schedule: 0 11 26 11 *
    duration: 384h
    applications:
    - '*'
    clusters:
    - k8s-launch-edge
    - ocp-hq
    manualSync: false
    timeZone: Europe/Berlin
  - kind: deny
    schedule: 0 0 21 12 *
    duration: 384h
    applications:
    - '*'
    clusters:
    - k8s-launch-edge
    - ocp-factory
    - ocp-hq
    manualSync: false
    timeZone: Europe/Berlin
  - kind: deny
    schedule: 0 9 19 1 *
    duration: 96h
    applications:
    - '*'
    clusters:
    - ocp-factory
    manualSync: false
    timeZone: Europe/Berlin
  - kind: deny
    schedule: 0 11 4 3 *
    duration: 384h
    applications:
    - '*'
    clusters:
    - k8s-launch-edge
    - ocp-hq
    manualSync: false
    timeZone: Europe/Berlin

