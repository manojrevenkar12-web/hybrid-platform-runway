---
# Inside a Linux guest moving from VMware to Proxmox VE. Two phases:
#   pre  - on VMware, before the window: pin interface names to MACs, add VirtIO to the initramfs,
#          install qemu-guest-agent (it stays idle until a virtio-serial channel exists)
#   post - on Proxmox, after the first boot: remove VMware Tools, start the guest agent
# Inputs per VM come from host_vars generated by `runway generate`: runway_nics (list of {mac}),
# runway_remove_vmware_tools and runway_vm.
guest_cutover_phase: pre
guest_cutover_rebuild_initramfs: true
guest_cutover_virtio_modules: [virtio_pci, virtio_blk, virtio_scsi, virtio_net]
