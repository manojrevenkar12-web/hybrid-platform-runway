---
- name: Bridge VLANs agree with the migration network map
  ansible.builtin.assert:
    that: pve_network_bridges | map(attribute='name') | unique | length == pve_network_bridges | length
    fail_msg: "bridge names must be unique"

- name: Node network configuration
  ansible.builtin.template:
    src: interfaces.j2
    dest: "{{ pve_network_interfaces_path }}"
    mode: "0644"
    backup: true
  register: _net

- name: Apply without a reboot (ifupdown2)
  ansible.builtin.command: ifreload -a
  changed_when: true
  when: _net is changed and not (pve_network_in_container | default(false))
