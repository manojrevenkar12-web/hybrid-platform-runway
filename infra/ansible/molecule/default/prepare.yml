---
- name: Make the containers look like freshly migrated VMs
  hosts: all
  gather_facts: true
  tasks:
    - name: SSH server and open-vm-tools present, as on a VMware guest (Debian)
      ansible.builtin.apt:
        name: [openssh-server, open-vm-tools]
        state: present
        update_cache: true
      when: ansible_facts.os_family == 'Debian'
    - name: SSH server and open-vm-tools present, as on a VMware guest (RedHat)
      ansible.builtin.dnf:
        name: [openssh-server, open-vm-tools]
        state: present
      when: ansible_facts.os_family == 'RedHat'
    - name: Host keys, as every real server has
      ansible.builtin.command: ssh-keygen -A
      args:
        creates: /etc/ssh/ssh_host_ed25519_key
    - name: Debian needs ifupdown2's directory for the node network
      ansible.builtin.file:
        path: /etc/network
        state: directory
        mode: "0755"
      when: ansible_facts.os_family == 'Debian'
