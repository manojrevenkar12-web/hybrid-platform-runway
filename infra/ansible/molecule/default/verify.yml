---
- name: Verify what each role promised
  hosts: all
  gather_facts: true
  tasks:
    - name: Read the files the roles own
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/ssh/sshd_config.d/10-baseline.conf
        - /etc/sysctl.d/90-baseline.conf
        - "/etc/systemd/network/10-runway-{{ ansible_facts.default_ipv4.interface }}.link"
        - /etc/runway-migrated
      register: files

    - name: Contents
      ansible.builtin.set_fact:
        sshd: "{{ files.results[0].content | b64decode }}"
        sysctl: "{{ files.results[1].content | b64decode }}"
        link: "{{ files.results[2].content | b64decode }}"

    - name: SSH, kernel and interface pinning are as specified
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in sshd and 'PasswordAuthentication no' in sshd"
          - "'net.ipv4.ip_forward = 0' in sysctl"
          - "('MACAddress=' ~ ansible_facts.default_ipv4.macaddress | lower) in link"
          - "('Name=' ~ ansible_facts.default_ipv4.interface) in link"

    - name: The SSH daemon accepts the hardened configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Package state after the cutover
      ansible.builtin.package_facts:

    - name: VMware Tools gone, guest agent in
      ansible.builtin.assert:
        that:
          - "'open-vm-tools' not in ansible_facts.packages"
          - "'qemu-guest-agent' in ansible_facts.packages"

    - name: VirtIO in the initramfs configuration
      ansible.builtin.command: "grep -h virtio_scsi {{ initramfs_conf[ansible_facts.os_family] }}"
      vars:
        initramfs_conf:
          RedHat: /etc/dracut.conf.d/90-runway-virtio.conf
          Debian: /etc/initramfs-tools/modules
      changed_when: false

    - name: Proxmox bridges are VLAN-aware and carry the mapped VLANs (Debian)
      ansible.builtin.command: grep -A6 "^iface vmbr2" /etc/network/interfaces
      register: vmbr2
      changed_when: false
      failed_when: "'bridge-vlan-aware yes' not in vmbr2.stdout or 'bridge-vids 310' not in vmbr2.stdout"
      when: ansible_facts.os_family == 'Debian'
