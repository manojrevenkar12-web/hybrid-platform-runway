---
- name: Every Linux server
  hosts: linux
  become: true
  roles: [linux_baseline]

- name: Guests in the current migration wave (host_vars generated by `runway generate`)
  hosts: wave
  become: true
  roles: [guest_cutover]

- name: Proxmox VE nodes
  hosts: pve_nodes
  become: true
  roles: [pve_network]
