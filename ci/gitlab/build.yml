build:runway:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile deploy/runway.Dockerfile
        --destination "$RUNWAY_IMAGE:$CI_COMMIT_SHORT_SHA" --cache=true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

scan:runway:
  stage: scan
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  script:
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$RUNWAY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - trivy image --format cyclonedx --output sbom.cdx.json "$RUNWAY_IMAGE:$CI_COMMIT_SHORT_SHA"
  artifacts:
    paths: [sbom.cdx.json]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
