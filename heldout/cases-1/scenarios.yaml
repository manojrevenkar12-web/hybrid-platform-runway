# Written blind from heldout/WRITING_CASES.md on 2026-10-28.
# Move time per VM (minutes) = disk_gib * 1024 / copy_mib_per_s / 60 + per_vm_overhead_min.
# At 300 MiB/s and 10 min overhead: 0 GiB 10.00, 40 GiB 12.28, 50 GiB 12.84, 60 GiB 13.41, 80 GiB 14.55,
# 100 GiB 15.69, 200 GiB 21.38, 300 GiB 27.07, 400 GiB 32.76, 500 GiB 38.44, 2000 GiB 123.78,
# 2500 GiB 152.22, 3000 GiB 180.67, 3500 GiB 209.11, 4000 GiB 237.56.
