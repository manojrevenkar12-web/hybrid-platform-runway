    # Windows Wed 3, 10, 17, 24 Mar 19:00-24:00 (until 27 Mar, before DST), budget 300 * 0.8 = 240 min.
    # Blackout pentest (hq) 10 Mar 00:00 .. 11 Mar 00:00 removes 10 Mar. Usable: 3, 17, 24 Mar.
    # Two dwh VMs = 371.3 > 240 -> one per window -> dwh uses 3, 17 and 24 Mar (all usable windows).
    # dwh-etl must follow dwh; only 24 Mar remains: 185.67 + 19.27 = 204.93 <= 240, so it fits there.
    start: "2027-03-01T00:00:00+01:00"
    until: "2027-03-27T00:00:00+01:00"
    timezone: Europe/Berlin
    maintenance_windows: [{days: [wed], start: "19:00", hours: 5}]
    migration: {copy_mib_per_s: 400, per_vm_overhead_min: 15, rollback_reserve_share: 0.2, max_vms_per_wave: 10}
