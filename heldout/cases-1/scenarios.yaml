  # ---------------------------------------------------------------------------------------------
  - id: s09
    description: CPU overcommit stops an HPC group at hq, and three-way anti-affinity with one small factory node stops a Kafka group that memory alone would allow.
    # hq: 2 nodes x 16 cores x overcommit 2 = 32 vCPUs per node. hpc 24 vCPUs each -> one per node -> 2 of 3.
    # Memory is no limit (96 <= 512 - 256). license 8 vCPUs fits next to one hpc VM: 24 + 8 = 32 <= 32.
    # factory: 256 + 256 + 32 -> 544 - 256 = 288 >= 3 x 64 = 192, and f1 alone holds three 64 GiB VMs,
    # but anti-affinity allows ceil(3/3) = 1 per node and f3 (32 GiB) cannot hold a 64 GiB VM -> kafka unplaced.
    # mqtt 16 GiB: with two kafka VMs left placed, 128 + 16 = 144 <= 288 and every node has room -> placed.
    start: "2027-02-01T00:00:00+01:00"
    until: "2027-03-01T00:00:00+01:00"
